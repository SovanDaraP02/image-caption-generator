[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caption-generator"
version = "0.1.0"
description = "ResNet encoder + Bahdanau attention + LSTM decoder image captioning, trained on Flickr8k"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pandas",
    "pillow",
    "nltk",
    "scikit-learn",
    "streamlit",
    "matplotlib",
    "scipy",
    "pycocoevalcap",
    "datasets",
    "transformers>=4.40",
    "anthropic>=0.40",
    "requests",
    "einops",
    "einops_exts",
    "open_clip_torch",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "httpx"]

[project.scripts]
caption-train = "caption_generator.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines: mostly docstring prose, not code

[tool.mypy]
# no python_version pin: let mypy infer it from the interpreter running it,
# since pinning to the project's minimum (3.10) makes mypy parse installed
# stubs (e.g. numpy's) that use newer syntax than that minimum, which fails.
ignore_missing_imports = true
exclude = ["^\\.venv/", "^notebooks/"]
warn_unused_ignores = false
